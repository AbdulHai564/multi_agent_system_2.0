services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "abdulhai"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "multi_agent_db"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    env_file:
      - .env